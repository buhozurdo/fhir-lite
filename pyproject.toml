[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-lite"
version = "0.1.0"
description = "Ultra-lightweight, zero-dependency FHIR library for Python."
readme = "README.md"
authors = [
    { name = "Juan Rael Corrales", email = "raelcorrales@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BuhoZurdo/fhir-lite"
Repository = "https://github.com/BuhoZurdo/fhir-lite.git"
"Bug Tracker" = "https://github.com/BuhoZurdo/fhir-lite/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fhir_lite*"]
